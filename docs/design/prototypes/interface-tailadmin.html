<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outsourcing, nova interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral branca de 290px + cabeçalho fixo + conteúdo sobre cinza claro (TailAdmin). Tokens: docs/design/DESIGN.md §3.2 */
:root {
  --bg: #f9fafb; --surface: #ffffff; --surface-2: #f9fafb; --text: #1d2939; --text-2: #344054; --muted: #667085;
  --border: #e4e7ec; --border-soft: #f2f4f7;
  --brand: #465fff; --brand-hover: #3641f5; --brand-soft: #ecf3ff; --brand-text: #465fff; --brand-200: #c2d6ff;
  --success: #12b76a; --success-soft: #ecfdf3; --success-text: #027a48;
  --warning: #f79009; --warning-soft: #fffaeb; --warning-text: #b54708;
  --error: #f04438; --error-soft: #fef3f2; --error-text: #b42318;
  --info: #0ba5ec; --info-soft: #f0f9ff; --info-text: #026aa2;
  --gray-soft: #f2f4f7; --gray-text: #344054;
  --shadow-xs: 0 1px 2px rgba(16,24,40,.05);
  --shadow-sm: 0 1px 3px rgba(16,24,40,.1), 0 1px 2px rgba(16,24,40,.06);
  --shadow-md: 0 4px 8px -2px rgba(16,24,40,.1), 0 2px 4px -2px rgba(16,24,40,.06);
  --ring: 0 0 0 4px rgba(70,95,255,.14);
  --overlay: rgba(16,24,40,.5);
  --font: "Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101828; --surface: #1a2231; --surface-2: #202a3b; --text: #e4e7ec; --text-2: #c4cad4; --muted: #98a2b3;
    --border: #1d2939; --border-soft: #243042;
    --brand-hover: #7592ff; --brand-soft: rgba(70,95,255,.16); --brand-text: #7592ff; --brand-200: #3641f5;
    --success-soft: rgba(18,183,106,.15); --success-text: #32d583;
    --warning-soft: rgba(247,144,9,.15); --warning-text: #fdb022;
    --error-soft: rgba(240,68,56,.15); --error-text: #f97066;
    --info-soft: rgba(11,165,236,.15); --info-text: #36bffa;
    --gray-soft: #243042; --gray-text: #c4cad4;
    --overlay: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101828; --surface: #1a2231; --surface-2: #202a3b; --text: #e4e7ec; --text-2: #c4cad4; --muted: #98a2b3;
  --border: #1d2939; --border-soft: #243042;
  --brand-hover: #7592ff; --brand-soft: rgba(70,95,255,.16); --brand-text: #7592ff; --brand-200: #3641f5;
  --success-soft: rgba(18,183,106,.15); --success-text: #32d583;
  --warning-soft: rgba(247,144,9,.15); --warning-text: #fdb022;
  --error-soft: rgba(240,68,56,.15); --error-text: #f97066;
  --info-soft: rgba(11,165,236,.15); --info-text: #36bffa;
  --gray-soft: #243042; --gray-text: #c4cad4;
  --overlay: rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 400 14px/20px var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; text-wrap: balance; color: var(--text); }
h1 { font-size: 24px; line-height: 32px; font-weight: 600; }
h2 { font-size: 18px; line-height: 28px; font-weight: 600; }
h3 { font-size: 16px; line-height: 24px; font-weight: 600; }
p { margin: 0; }
a { color: var(--brand-text); text-decoration: none; }
a:hover { text-decoration: underline; }
.num { font-variant-numeric: tabular-nums; }
.strong { color: var(--text); font-weight: 500; }
.search-btn { display: none; }
.muted { color: var(--muted); }
.small { font-size: 12px; line-height: 18px; }
.ico { width: 20px; height: 20px; flex: none; fill: currentColor; }
.ico-sm { width: 16px; height: 16px; }
.ico-lg { width: 24px; height: 24px; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -48px; z-index: 100; background: var(--brand); color: #fff; padding: 8px 12px; border-radius: 8px; }
.skip:focus { top: 12px; }

/* Estrutura */
.shell { display: flex; min-height: 100%; }
.sidebar { width: 290px; flex: none; background: var(--surface); border-right: 1px solid var(--border); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; transition: width .2s; z-index: 40; }
.brand { display: flex; align-items: center; gap: 10px; height: 64px; padding: 0 24px; font-size: 20px; font-weight: 700; color: var(--text); flex: none; }
.brand:hover { text-decoration: none; }
.brand-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--brand); display: grid; grid-template-columns: repeat(3, 4px); gap: 3px; align-items: end; justify-content: center; padding-bottom: 8px; }
.brand-mark b { display: block; width: 4px; background: #fff; border-radius: 2px; }
.brand-mark b:nth-child(1) { height: 14px; } .brand-mark b:nth-child(2) { height: 9px; } .brand-mark b:nth-child(3) { height: 12px; }
.nav { padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 4px; }
.nav-group { font-size: 12px; line-height: 18px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 16px 12px 6px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px; color: var(--text-2); font-weight: 500; min-height: 40px; }
.nav-item .ico { color: var(--muted); }
.nav-item:hover { background: var(--surface-2); text-decoration: none; }
.nav-item.active { background: var(--brand-soft); color: var(--brand-text); }
.nav-item.active .ico { color: var(--brand-text); }
.collapsed .sidebar { width: 90px; }
.collapsed .sidebar .brand span, .collapsed .nav-item span, .collapsed .nav-group span { display: none; }
.collapsed .nav-group { text-align: center; padding-left: 0; padding-right: 0; }
.collapsed .nav-group::before { content: "···"; }
.collapsed .nav-item { justify-content: center; }
.collapsed .brand { justify-content: center; padding: 0; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 30; height: 64px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 0 24px; }
.search { position: relative; flex: 1; max-width: 430px; }
.search .ico { position: absolute; left: 14px; top: 12px; color: var(--muted); }
.search input { padding-left: 42px; }
.topbar .grow { flex: 1; }
.proto-tag { font-size: 12px; font-weight: 500; color: var(--warning-text); background: var(--warning-soft); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.user-btn { display: flex; align-items: center; gap: 10px; background: none; border: 0; color: var(--text-2); font: inherit; font-weight: 500; cursor: pointer; padding: 4px; border-radius: 8px; min-height: 44px; }
.user-btn:hover { background: var(--surface-2); }
.avatar { width: 36px; height: 36px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-text); display: inline-grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
.avatar.sm { width: 24px; height: 24px; font-size: 10px; }
.avatar.lg { width: 72px; height: 72px; font-size: 24px; }
.avatars { display: flex; }
.avatars .avatar { border: 2px solid var(--surface); margin-left: -8px; }
.avatars .avatar:first-child { margin-left: 0; }
.menu { position: absolute; right: 0; top: calc(100% + 8px); width: 260px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-md); padding: 12px; display: none; z-index: 50; }
.menu.open { display: block; }
.menu-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 12px; border-radius: 8px; color: var(--text-2); background: none; border: 0; font: inherit; font-weight: 500; cursor: pointer; text-align: left; min-height: 40px; }
.menu-item:hover { background: var(--surface-2); text-decoration: none; }
.menu-item.on { color: var(--brand-text); background: var(--brand-soft); }
.menu hr { border: 0; border-top: 1px solid var(--border-soft); margin: 8px 0; }
.content { padding: 24px; width: 100%; max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.backdrop { position: fixed; inset: 0; background: var(--overlay); z-index: 35; display: none; }

/* Cabeçalho da página */
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; line-height: 18px; color: var(--muted); margin-bottom: 4px; }
.crumbs a { color: var(--muted); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head p { color: var(--muted); margin-top: 4px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 8px; border: 1px solid transparent; font: 500 14px/20px var(--font); cursor: pointer; box-shadow: var(--shadow-xs); white-space: nowrap; text-decoration: none !important; }
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-hover); }
.btn-secondary { background: var(--surface); color: var(--text-2); border-color: var(--border); }
.btn-secondary:hover { background: var(--surface-2); }
.btn-danger { background: var(--error); color: #fff; }
.btn-danger:hover { background: #d92d20; }
.btn-danger-outline { background: var(--surface); color: var(--error-text); border-color: var(--border); }
.btn-danger-outline:hover { background: var(--error-soft); }
.btn-sm { min-height: 36px; padding: 7px 12px; }
.btn-icon { width: 36px; min-height: 36px; padding: 0; }
.btn-ghost { background: none; box-shadow: none; color: var(--muted); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn:disabled { opacity: .6; cursor: progress; }

/* Cartões */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 24px; border-bottom: 1px solid var(--border-soft); flex-wrap: wrap; }
.card-head p { color: var(--muted); }
.card-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.card-foot { padding: 16px 24px; border-top: 1px solid var(--border-soft); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grid { display: grid; gap: 24px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-side { grid-template-columns: minmax(0, 1fr) 320px; }
.stat { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
.stat-ico { width: 48px; height: 48px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; color: var(--text-2); }
.stat-num { font-size: 30px; line-height: 38px; font-weight: 600; }
.stat-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.pairs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 24px; margin: 0; }
.pairs div { min-width: 0; }
.pairs dt { font-size: 12px; line-height: 18px; color: var(--muted); margin-bottom: 4px; }
.pairs dd { margin: 0; color: var(--text); font-weight: 500; overflow-wrap: anywhere; }
.pairs .full { grid-column: 1 / -1; }
.list { display: flex; flex-direction: column; }
.list-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-soft); min-width: 0; }
.list-row:last-child { border-bottom: 0; }
.list-row .grow { flex: 1; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }

/* Etiquetas */
.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; line-height: 18px; font-weight: 500; white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
.badge.plain::before { display: none; }
.b-gray { background: var(--gray-soft); color: var(--gray-text); }
.b-brand { background: var(--brand-soft); color: var(--brand-text); }
.b-info { background: var(--info-soft); color: var(--info-text); }
.b-success { background: var(--success-soft); color: var(--success-text); }
.b-warning { background: var(--warning-soft); color: var(--warning-text); }
.b-error { background: var(--error-soft); color: var(--error-text); }

/* Formulários */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .label { font-weight: 500; color: var(--text-2); }
.req { color: var(--error-text); }
.input, select.input, textarea.input { width: 100%; min-height: 44px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font: 400 14px/20px var(--font); box-shadow: var(--shadow-xs); }
textarea.input { min-height: 120px; resize: vertical; }
select.input { appearance: none; padding-right: 40px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 19px, calc(100% - 15px) 19px; background-size: 5px 5px; background-repeat: no-repeat; }
.input::placeholder { color: var(--muted); }
.input:focus { outline: none; border-color: var(--brand); box-shadow: var(--ring); }
.input.invalid { border-color: var(--error); box-shadow: 0 0 0 4px rgba(240,68,56,.12); }
.help { font-size: 12px; line-height: 18px; color: var(--muted); }
.err { font-size: 12px; line-height: 18px; color: var(--error-text); display: flex; gap: 6px; align-items: center; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.form-grid .full { grid-column: 1 / -1; }
.form-card { max-width: 720px; width: 100%; }
.check { display: flex; align-items: center; gap: 10px; min-height: 32px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--brand); }
.checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: end; padding: 16px 24px; border-bottom: 1px solid var(--border-soft); }
.filters .input { min-height: 40px; padding-top: 8px; padding-bottom: 8px; }
.filters select.input { background-position: calc(100% - 20px) 17px, calc(100% - 15px) 17px; }
.filters .label { font-size: 12px; line-height: 18px; }
.filters .actions { flex-wrap: nowrap; }
.filter-toggle { display: none; }

/* Tabela */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; line-height: 18px; font-weight: 500; color: var(--muted); background: var(--surface-2); padding: 12px 16px; white-space: nowrap; }
td { padding: 14px 16px; border-top: 1px solid var(--border-soft); color: var(--text-2); vertical-align: middle; }
tr:hover td { background: var(--surface-2); }
td.r, th.r { text-align: right; }
td .strong { color: var(--text); font-weight: 500; }
td.acts { white-space: nowrap; text-align: right; }
td.acts .actions { justify-content: flex-end; flex-wrap: nowrap; }
.pager { display: flex; gap: 4px; align-items: center; }
.pager button { min-width: 36px; height: 36px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--text-2); font: 500 14px var(--font); cursor: pointer; padding: 0 10px; }
.pager button:hover:not(:disabled) { background: var(--surface-2); }
.pager button.on { background: var(--brand-soft); color: var(--brand-text); }
.pager button.edge { border-color: var(--border); }
.pager button:disabled { opacity: .45; cursor: default; }

/* Estado vazio */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 40px 24px; }
.empty-ico { width: 56px; height: 56px; border-radius: 999px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); margin-bottom: 4px; }
.empty p { color: var(--muted); max-width: 42ch; }

/* Quadro */
.board { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 16px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
.col { background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 12px; min-height: 280px; scroll-snap-align: start; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 4px 4px 0; }
.col-head h3 { font-size: 14px; line-height: 20px; flex: 1; }
.count { font-size: 12px; font-weight: 500; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; color: var(--muted); }
.task { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--muted); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.task:hover { box-shadow: var(--shadow-sm); }
.task.p-medium { border-left-color: var(--info); } .task.p-high { border-left-color: var(--warning); } .task.p-urgent { border-left-color: var(--error); } .task.p-low { border-left-color: #98a2b3; }
.task a { color: var(--text); font-weight: 500; }
.task-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; line-height: 18px; color: var(--muted); }
.task-meta .due { display: inline-flex; gap: 4px; align-items: center; }
.task-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.col-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 8px; border: 1px dashed var(--border); border-radius: 12px; }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; background: var(--info-soft); color: var(--info-text); }
.notice.warn { background: var(--warning-soft); color: var(--warning-text); }

/* Assistente */
.chat { display: flex; flex-direction: column; height: min(640px, calc(100vh - 220px)); min-height: 420px; }
.msgs { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; }
.msg.me { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: var(--surface-2); color: var(--text); border-bottom-left-radius: 4px; }
.msg.bot ul, .msg.bot ol { margin: 6px 0; padding-left: 20px; }
.msg.bot p + p { margin-top: 6px; }
.msg code { background: var(--border-soft); border-radius: 4px; padding: 0 4px; }
.typing { display: inline-flex; gap: 4px; }
.typing i { width: 6px; height: 6px; border-radius: 999px; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
.composer { border-top: 1px solid var(--border-soft); padding: 16px 24px; display: flex; flex-direction: column; gap: 8px; }
.composer form { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { min-height: 44px; height: 44px; resize: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--border); background: var(--surface); color: var(--text-2); border-radius: 999px; padding: 6px 12px; font: 500 13px var(--font); cursor: pointer; text-align: left; }
.chip:hover { border-color: var(--brand); color: var(--brand-text); }
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--border-soft); }
.bar span { display: block; height: 100%; border-radius: 999px; background: var(--brand); }
.bar.warn span { background: var(--warning); } .bar.crit span { background: var(--error); }

/* Autenticação e erros */
.auth { display: grid; grid-template-columns: 1fr 1fr; min-height: 100%; }
.auth-form { display: grid; place-items: center; padding: 40px 24px; }
.auth-form .card { width: 100%; max-width: 440px; }
.auth-side { background: var(--brand); color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: center; gap: 24px; position: relative; overflow: hidden; }
.auth-side h2 { color: #fff; font-size: 30px; line-height: 38px; }
.auth-side p { color: rgba(255,255,255,.85); max-width: 46ch; }
.auth-side ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
.auth-side li { display: flex; gap: 10px; align-items: center; }
.auth-side .grid-deco { position: absolute; right: -60px; bottom: -60px; width: 280px; height: 280px; border-radius: 40px; border: 1px solid rgba(255,255,255,.2); transform: rotate(18deg); }
.error-page { min-height: 100%; display: grid; place-items: center; padding: 40px 24px; text-align: center; }
.error-code { font-size: 72px; line-height: 90px; font-weight: 700; color: var(--brand-text); }
.hero { padding: 40px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
.hero h1 { font-size: 30px; line-height: 38px; max-width: 24ch; }
.hero p { color: var(--muted); max-width: 60ch; font-size: 16px; line-height: 24px; }
.feature { padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.diagram svg { width: 100%; height: auto; display: block; }
.diagram { overflow-x: auto; }

/* Toast e modal */
.toasts { position: fixed; right: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 12px; z-index: 80; width: min(380px, calc(100vw - 32px)); }
.toast { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-md); padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; color: var(--text); animation: in .2s ease-out; }
.toast .t-ico { color: var(--success); } .toast.erro .t-ico { color: var(--error); } .toast.info .t-ico { color: var(--info); }
.toast p { flex: 1; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } }
.modal-bg { position: fixed; inset: 0; background: var(--overlay); backdrop-filter: blur(2px); display: grid; place-items: center; z-index: 90; padding: 16px; }
.modal { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-md); width: 100%; max-width: 440px; padding: 24px; display: flex; flex-direction: column; gap: 16px; border: 1px solid var(--border); }
.modal-ico { width: 48px; height: 48px; border-radius: 999px; background: var(--error-soft); color: var(--error-text); display: grid; place-items: center; }
.modal .actions { justify-content: flex-end; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Responsivo */
@media (max-width: 1199.98px) {
  .grid-side { grid-template-columns: 1fr; }
  .chat { height: 560px; }
}
@media (max-width: 991.98px) {
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); transition: transform .2s; width: 290px !important; box-shadow: var(--shadow-md); }
  .drawer-open .sidebar { transform: none; }
  .drawer-open .backdrop { display: block; }
  .collapsed .sidebar .brand span, .collapsed .nav-item span, .collapsed .nav-group span { display: initial; }
  .collapsed .nav-group::before { content: none; }
  .collapsed .nav-item { justify-content: flex-start; }
  .collapsed .nav-group { text-align: left; padding: 16px 12px 6px; }
  .collapsed .brand { justify-content: flex-start; padding: 0 24px; }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .auth { grid-template-columns: 1fr; }
  .auth-side { display: none; }
  .board { grid-template-columns: repeat(4, 280px); }
}
@media (max-width: 767.98px) {
  .content { padding: 16px; gap: 16px; }
  .topbar { padding: 0 12px; gap: 8px; }
  .search { display: none; }
  .search-btn { display: inline-flex !important; }
  .user-name, .proto-tag { display: none; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .grid { gap: 16px; }
  .page-head { align-items: stretch; flex-direction: column; }
  .page-head .actions { width: 100%; }
  .page-head .actions .btn { flex: 1; }
  .card-head, .card-body { padding: 16px; }
  .card-foot { padding: 12px 16px; }
  .form-grid, .pairs, .checks { grid-template-columns: 1fr; }
  .form-foot { flex-direction: column-reverse; align-items: stretch; }
  .form-foot .btn { width: 100%; }
  .btn-icon { width: 44px; min-height: 44px; }
  .filter-toggle { display: inline-flex; }
  .filters { display: none; padding: 16px; }
  .filters.open { display: grid; }
  .board { grid-template-columns: repeat(4, 85%); }
  .msg { max-width: 92%; }
  .hero { padding: 24px; }
  .hero h1 { font-size: 24px; line-height: 32px; }
  /* Tabelas viram cartões */
  table.responsive thead { display: none; }
  table.responsive, table.responsive tbody, table.responsive tr, table.responsive td { display: block; width: 100%; }
  table.responsive tr { padding: 12px 16px; border-top: 1px solid var(--border-soft); display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  table.responsive tr:first-child { border-top: 0; }
  table.responsive td { border: 0; padding: 0; text-align: left !important; }
  table.responsive td::before { content: attr(data-label); display: block; font-size: 12px; line-height: 18px; color: var(--muted); }
  table.responsive td.lead { grid-column: 1 / -1; font-size: 15px; }
  table.responsive td.lead::before { display: none; }
  table.responsive td.acts { grid-column: 1 / -1; }
  table.responsive td.acts::before { display: none; }
  table.responsive td.acts .actions { justify-content: flex-start; }
  table.responsive tr:hover td { background: none; }
  .toasts { right: 16px; bottom: 16px; }
}

</style>

  if (ehAdmin()) return projetos;
  return projetos.filter((p) => p.criador === u.id || equipes.find((e) => e.id === p.equipe).gerente === u.id || p.membros.includes(u.id));
}
const tarefasVisiveis = () => { const ids = projetosVisiveis().map((p) => p.id); return tarefas.filter((t) => ids.includes(projetoDaTarefa(t).id)); };
const minhasNotas = () => notas.filter((n) => n.autor === eu().id);
const meusApontamentos = () => apontamentos.filter((a) => a.autor === eu().id);
const equipesVisiveis = () => ehAdmin() ? equipes : equipes.filter((e) => e.gerente === eu().id);
const consumo = (uid) => chamadas.filter((c) => c.usuario === uid).reduce((s, c) => s + c.ent + c.sai, 0) + (uid === 1 ? 1562 - 1130 : 0);
const limite = (uid) => cotas[uid] ?? ia.cotaPadrao;

// ---------- Componentes ----------
const badge = (texto, cor, plain) => `<span class="badge ${cor}${plain ? ' plain' : ''}">${esc(texto)}</span>`;
const CORES_PRIO = { low: 'b-gray', medium: 'b-info', high: 'b-warning', urgent: 'b-error' };
const CORES_TIPO = { backlog: 'b-gray', doing: 'b-brand', done: 'b-success', approved: 'b-success' };
const CORES_PAPEL = { admin: 'b-brand', gerente: 'b-info', dev: 'b-gray' };
const prio = (p) => badge(PRIORIDADES[p], CORES_PRIO[p]);
const est = (s) => badge(s.nome, CORES_TIPO[s.tipo]);
const papel = (p) => badge(PAPEIS[p], CORES_PAPEL[p], true);
const avatar = (u, cls = '') => `<span class="avatar ${cls}" title="${esc(nomeCompleto(u))}">${esc(iniciais(u))}</span>`;
const btn = (texto, { href, icone, cls = 'btn-secondary', acao, extra = '' } = {}) => href
  ? `<a class="btn ${cls}" href="${href}" ${extra}>${icone ? ic(icone, 'ico-sm') : ''}${texto ? `<span>${texto}</span>` : ''}</a>`
  : `<button type="button" class="btn ${cls}" ${acao ? `data-acao="${acao}"` : ''} ${extra}>${icone ? ic(icone, 'ico-sm') : ''}${texto ? `<span>${texto}</span>` : ''}</button>`;
const editar = (href) => `<a class="btn btn-secondary btn-sm btn-icon" href="${href}" aria-label="Editar" title="Editar">${ic('pencil', 'ico-sm')}</a>`;
const excluir = (tipo, id, nome) => `<button type="button" class="btn btn-danger-outline btn-sm btn-icon" data-excluir="${tipo}:${id}" data-nome="${esc(nome)}" aria-label="Excluir ${esc(nome)}" title="Excluir">${ic('trash3', 'ico-sm')}</button>`;
function head({ trilha = [], titulo, desc, acoes = '' }) {
  const migalhas = [['#inicio', 'Início'], ...trilha].map(([h, t], i, a) => i < a.length - 1 || h ? `<a href="${h}">${esc(t)}</a>` : `<span>${esc(t)}</span>`).join('<span aria-hidden="true">/</span>');
  return `<div><nav class="crumbs" aria-label="Trilha">${migalhas}<span aria-hidden="true">/</span><span>${esc(titulo)}</span></nav>
    <div class="page-head"><div><h1>${esc(titulo)}</h1>${desc ? `<p>${desc}</p>` : ''}</div>${acoes ? `<div class="actions">${acoes}</div>` : ''}</div></div>`;
}
const vazio = (icone, titulo, texto, acao = '') => `<div class="empty"><div class="empty-ico">${ic(icone, 'ico-lg')}</div><h3>${esc(titulo)}</h3><p>${texto}</p>${acao}</div>`;
function tabela(id, colunas, linhas, { porPagina = 10, vazioHtml } = {}) {
  if (!linhas.length) return vazioHtml || vazio('inbox', 'Nada encontrado', 'Ajuste os filtros ou cadastre um novo registro.');
  const total = linhas.length; const paginas = Math.max(1, Math.ceil(total / porPagina));
  const pag = Math.min(estado.pagina[id] || 1, paginas); const ini = (pag - 1) * porPagina;
  const corpo = linhas.slice(ini, ini + porPagina).map((cel) => `<tr>${cel.map((c, i) => `<td data-label="${esc(colunas[i].t)}" class="${colunas[i].c || ''}">${c}</td>`).join('')}</tr>`).join('');
  const botoes = Array.from({ length: paginas }, (_, i) => `<button type="button" class="${i + 1 === pag ? 'on' : ''}" data-pagina="${id}:${i + 1}" aria-label="Página ${i + 1}" ${i + 1 === pag ? 'aria-current="page"' : ''}>${i + 1}</button>`).join('');
  return `<div class="table-wrap"><table class="responsive"><thead><tr>${colunas.map((c) => `<th class="${c.c || ''}">${esc(c.t)}</th>`).join('')}</tr></thead><tbody>${corpo}</tbody></table></div>
    <div class="card-foot"><span class="muted small num">Mostrando ${ini + 1}–${Math.min(ini + porPagina, total)} de ${total}</span>
    <div class="pager"><button type="button" class="edge" data-pagina="${id}:${pag - 1}" ${pag === 1 ? 'disabled' : ''}>Anterior</button>${botoes}<button type="button" class="edge" data-pagina="${id}:${pag + 1}" ${pag === paginas ? 'disabled' : ''}>Próxima</button></div></div>`;
}
function filtros(id, campos) {
  const v = estado.filtros[id] || {};
  const html = campos.map((c) => `<div class="field"><label class="label" for="f-${id}-${c.k}">${c.t}</label>${c.op
    ? `<select class="input" id="f-${id}-${c.k}" name="${c.k}">${[['', c.todos || 'Todos'], ...c.op].map(([val, txt]) => `<option value="${esc(val)}" ${String(v[c.k] ?? '') === String(val) ? 'selected' : ''}>${esc(txt)}</option>`).join('')}</select>`
    : `<input class="input" id="f-${id}-${c.k}" name="${c.k}" type="${c.tipo || 'text'}" value="${esc(v[c.k] || '')}" ${c.ph ? `placeholder="${c.ph}"` : ''}>`}</div>`).join('');
  return `<form class="filters" data-filtro="${id}">${html}<div class="actions"><button class="btn btn-primary btn-sm" type="submit">${ic('funnel', 'ico-sm')}<span>Filtrar</span></button><button class="btn btn-secondary btn-sm" type="button" data-limpar="${id}">Limpar</button></div></form>`;
}
function listaCard(id, titulo, contador, filtrosHtml, corpo) {
  return `<section class="card"><div class="card-head"><div><h2>${titulo}</h2><p class="small num">${contador}</p></div>${filtrosHtml ? `<button type="button" class="btn btn-secondary btn-sm filter-toggle" data-toggle-filtros="${id}">${ic('funnel', 'ico-sm')}<span>Filtros</span></button>` : ''}</div>${filtrosHtml || ''}${corpo}</section>`;
}
const pares = (itens) => `<dl class="pairs">${itens.map(([k, v, full]) => `<div class="${full ? 'full' : ''}"><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
function md(texto) {
  const linhas = esc(texto).split('\n'); let html = ''; let lista = null;
  const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/`(.+?)`/g, '<code>$1</code>');
  for (const l of linhas) {
    const ol = l.match(/^\d+\.\s+(.*)/); const ul = l.match(/^[-*]\s+(.*)/);
    if (ol || ul) { const tag = ol ? 'ol' : 'ul'; if (lista !== tag) { if (lista) html += `</${lista}>`; html += `<${tag}>`; lista = tag; } html += `<li>${inline((ol || ul)[1])}</li>`; continue; }
    if (lista) { html += `</${lista}>`; lista = null; }
    if (l.trim()) html += `<p>${inline(l)}</p>`;
  }
  if (lista) html += `</${lista}>`;
  return html;
}
const quotaBar = (uid) => { const c = consumo(uid), l = limite(uid), pct = Math.min(100, Math.round(c / l * 100)); return `<div class="bar ${pct >= 90 ? 'crit' : pct >= 70 ? 'warn' : ''}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Consumo da cota"><span style="width:${Math.max(pct, 1)}%"></span></div><p class="small muted num">${milhar(c)} de ${milhar(l)} tokens (${pct}%)</p>`; };

// ---------- Telas ----------
const telas = {};
const negado = () => telas['erro-403']();

telas.inicio = () => {
  const ts = tarefasVisiveis(); const abertas = ts.filter((t) => ['backlog', 'doing'].includes(estagioDe(t).tipo));
  const ps = projetosVisiveis();
  const stat = (icone, rotulo, valor, extra) => `<div class="card stat"><div class="stat-ico">${ic(icone, 'ico-lg')}</div><div class="stat-row"><div><p class="muted">${rotulo}</p><p class="stat-num num">${valor}</p></div>${extra || ''}</div></div>`;
  const recentes = [...ts].sort((a, b) => b.criada - a.criada).slice(0, 5);
  return `${head({ titulo: `Olá, ${eu().nome}`, desc: 'Resumo das tarefas e projetos em que você participa.', acoes: btn('Ver quadros', { href: '#quadros', icone: 'kanban', cls: 'btn-primary' }) }).replace(/<nav[^]*?<\/nav>/, '')}
  <div class="grid grid-3">
    ${stat('list-check', 'Tarefas abertas', abertas.length, badge('backlog e em andamento', 'b-gray', true))}
    ${stat('exclamation-triangle', 'Urgentes', abertas.filter((t) => t.prioridade === 'urgent').length, badge('prioridade urgente', 'b-error', true))}
    ${stat('folder2-open', 'Projetos em que participo', ps.length, '')}
  </div>
  <div class="grid grid-2">
    <section class="card"><div class="card-head"><h2>Tarefas recentes</h2>${btn('Ver tarefas', { href: '#tarefas', cls: 'btn-secondary btn-sm' })}</div><div class="card-body" style="padding-top:8px;padding-bottom:8px"><div class="list">
      ${recentes.map((t) => `<div class="list-row">${prio(t.prioridade)}<div class="grow"><a class="ellipsis" href="#tarefa-${t.id}">${esc(t.titulo)}</a><span class="small muted ellipsis">${esc(projetoDaTarefa(t).nome)} · ${esc(estagioDe(t).nome)}</span></div>${avatar(U(t.responsavel), 'sm')}</div>`).join('') || vazio('inbox', 'Nenhuma tarefa por aqui ainda', 'As tarefas dos seus projetos aparecem aqui.')}
    </div></div></section>
    <section class="card"><div class="card-head"><h2>Projetos recentes</h2>${btn('Ver quadros', { href: '#quadros', cls: 'btn-secondary btn-sm' })}</div><div class="card-body" style="padding-top:8px;padding-bottom:8px"><div class="list">
      ${ps.map((p) => { const tp = tarefas.filter((t) => projetoDaTarefa(t).id === p.id); const feitas = tp.filter((t) => ['done', 'approved'].includes(estagioDe(t).tipo)).length; const pct = Math.round(feitas / tp.length * 100); return `<div class="list-row"><div class="stat-ico" style="width:40px;height:40px">${ic('kanban')}</div><div class="grow"><a class="ellipsis" href="#quadro-${p.id}">${esc(p.nome)}</a><div class="bar" style="margin-top:6px"><span style="width:${pct}%"></span></div></div><span class="small muted num">${pct}%</span></div>`; }).join('') || (ehGestor() ? vazio('folder2-open', 'Você ainda não tem projetos', 'Crie um projeto para a sua equipe; o quadro já vem com os estágios padrão.', btn('Criar projeto', { href: '#projeto-novo', icone: 'plus-lg', cls: 'btn-primary' })) : vazio('folder2-open', 'Você ainda não participa de projetos', 'Peça ao gerente da sua equipe para incluir você em um projeto.'))}
    </div></div></section>
  </div>`;
};

telas.quadros = () => {
  const linhas = projetosVisiveis().map((p) => { const ts = tarefas.filter((t) => projetoDaTarefa(t).id === p.id); return [`<a class="strong" href="#quadro-${p.id}">${esc(p.nome)}</a>`, badge(equipes.find((e) => e.id === p.equipe).nome, 'b-gray', true), `<div class="avatars">${p.membros.map((m) => avatar(U(m), 'sm')).join('')}</div>`, `<span class="num">${ts.length}</span>`, `<span class="num">${fmt(p.termino)}</span>`, `<a class="btn btn-secondary btn-sm" href="#quadro-${p.id}">${ic('kanban', 'ico-sm')}<span>Abrir quadro</span></a>`]; });
  return `${head({ titulo: 'Quadros', desc: 'Os quadros kanban dos projetos em que você participa.' })}
  ${listaCard('quadros', 'Projetos', `${linhas.length} quadros`, '', tabela('quadros', [{ t: 'Projeto', c: 'lead' }, { t: 'Equipe' }, { t: 'Membros' }, { t: 'Tarefas', c: 'r' }, { t: 'Término' }, { t: '', c: 'acts' }], linhas, { vazioHtml: vazio('kanban', 'Você ainda não participa de projetos', 'Peça ao gerente da sua equipe para incluir você em um projeto.') }))}`;
};

telas.quadro = (id) => {
  const p = projetosVisiveis().find((x) => x.id === id); if (!p) return telas['erro-404']();
  const ests = estagios.filter((s) => s.projeto === p.id).sort((a, b) => a.ordem - b.ordem);
  const eq = equipes.find((e) => e.id === p.equipe);
  const total = tarefas.filter((t) => ests.some((s) => s.id === t.estagio)).length;
  const cols = ests.map((s, i) => {
    const ts = tarefas.filter((t) => t.estagio === s.id);
    const cards = ts.map((t) => {
      const vencida = t.prazo < HOJE && !['done', 'approved'].includes(s.tipo);
      return `<article class="task p-${t.prioridade}"><a href="#tarefa-${t.id}">${esc(t.titulo)}</a>
      <div class="task-meta">${prio(t.prioridade)}<span class="due" style="${vencida ? 'color:var(--error-text)' : ''}">${ic('calendar3', 'ico-sm')}${fmtCurta(t.prazo)}${vencida ? ' · vencida' : ''}</span></div>
      <div class="task-foot"><span class="task-meta">${avatar(U(t.responsavel), 'sm')}${esc(t.responsavel ? U(t.responsavel).nome : 'Sem responsável')}</span><span class="actions" style="flex-wrap:nowrap">
      ${i > 0 ? `<button type="button" class="btn btn-secondary btn-sm btn-icon" data-mover="${t.id}:${ests[i - 1].id}" aria-label="Mover para ${esc(ests[i - 1].nome)}" title="Mover para ${esc(ests[i - 1].nome)}">${ic('chevron-left', 'ico-sm')}</button>` : ''}
      ${i < ests.length - 1 ? `<button type="button" class="btn btn-secondary btn-sm btn-icon" data-mover="${t.id}:${ests[i + 1].id}" aria-label="Mover para ${esc(ests[i + 1].nome)}" title="Mover para ${esc(ests[i + 1].nome)}">${ic('chevron-right', 'ico-sm')}</button>` : ''}
      </span></div></article>`;
    }).join('');
    return `<section class="col" aria-label="${esc(s.nome)}"><div class="col-head"><h3>${esc(s.nome)}</h3><span class="count num">${ts.length}</span><button type="button" class="btn btn-ghost btn-sm btn-icon" data-nova-tarefa="${s.id}" aria-label="Nova tarefa em ${esc(s.nome)}" title="Nova tarefa em ${esc(s.nome)}">${ic('plus-lg', 'ico-sm')}</button></div>${cards || '<p class="col-empty">Nenhuma tarefa</p>'}</section>`;
  }).join('');
  return `${head({ trilha: [['#quadros', 'Quadros']], titulo: p.nome, desc: `Equipe ${esc(eq.nome)} · ${total} tarefas · término em ${fmt(p.termino)}`, acoes: `<div class="avatars" style="align-self:center;margin-right:8px">${p.membros.map((m) => avatar(U(m))).join('')}</div>${ehGestor() ? btn('Detalhes', { href: `#projeto-${p.id}`, icone: 'info-circle' }) : ''}<button type="button" class="btn btn-primary" data-nova-tarefa="${ests[0].id}">${ic('plus-lg', 'ico-sm')}<span>Nova tarefa</span></button>` })}
  ${total ? '' : `<div class="notice">${ic('info-circle')}<p>Este projeto ainda não tem tarefas. Use <strong>Nova tarefa</strong> ou o <strong>+</strong> de uma coluna e depois mova as tarefas com as setas.</p></div>`}
  <div class="board">${cols}</div>`;
};

function filtrar(id, lista, regras) { const v = estado.filtros[id] || {}; return lista.filter((x) => Object.entries(regras).every(([k, fn]) => !v[k] || fn(x, v[k]))); }
telas.tarefas = () => {
  const ps = projetosVisiveis();
  const resp = [...new Set(tarefasVisiveis().map((t) => t.responsavel).filter(Boolean))].map(U);
  const lista = filtrar('tarefas', tarefasVisiveis(), {
    titulo: (t, v) => t.titulo.toLowerCase().includes(v.toLowerCase()), projeto: (t, v) => projetoDaTarefa(t).id === Number(v),
    prioridade: (t, v) => t.prioridade === v, responsavel: (t, v) => t.responsavel === Number(v), prazo: (t, v) => t.prazo <= deIso(v),
  }).sort((a, b) => a.prazo - b.prazo);
  const linhas = lista.map((t) => [`<a class="strong" href="#tarefa-${t.id}">${esc(t.titulo)}</a>`, esc(projetoDaTarefa(t).nome), est(estagioDe(t)), prio(t.prioridade), `<span style="display:inline-flex;gap:8px;align-items:center">${avatar(U(t.responsavel), 'sm')}${esc(t.responsavel ? U(t.responsavel).nome : '—')}</span>`, `<span class="num">${fmt(t.prazo)}</span>`, `<div class="actions">${editar(`#tarefa-editar-${t.id}`)}${excluir('tarefa', t.id, t.titulo)}</div>`]);
  return `${head({ titulo: 'Tarefas', desc: 'Tarefas dos projetos em que você participa.', acoes: btn('Nova tarefa', { href: '#tarefa-nova', icone: 'plus-lg', cls: 'btn-primary' }) })}
  ${listaCard('tarefas', 'Todas as tarefas', `${lista.length} tarefas`, filtros('tarefas', [{ k: 'titulo', t: 'Título', ph: 'Buscar pelo título' }, { k: 'projeto', t: 'Projeto', op: ps.map((p) => [p.id, p.nome]) }, { k: 'prioridade', t: 'Prioridade', todos: 'Todas', op: Object.entries(PRIORIDADES) }, { k: 'responsavel', t: 'Responsável', op: resp.map((u) => [u.id, nomeCompleto(u)]) }, { k: 'prazo', t: 'Prazo até', tipo: 'date' }]),
    tabela('tarefas', [{ t: 'Título', c: 'lead' }, { t: 'Projeto' }, { t: 'Estágio' }, { t: 'Prioridade' }, { t: 'Responsável' }, { t: 'Prazo' }, { t: '', c: 'acts' }], linhas))}`;
};

telas.tarefa = (id) => {
  const t = tarefasVisiveis().find((x) => x.id === id); if (!t) return telas['erro-404']();
  const p = projetoDaTarefa(t); const ns = minhasNotas().filter((n) => n.tarefa === t.id); const as = meusApontamentos().filter((a) => a.tarefa === t.id);
  const horas = as.reduce((s, a) => s + a.horas, 0);
  return `${head({ trilha: [['#tarefas', 'Tarefas']], titulo: t.titulo, acoes: `${btn('Abrir quadro', { href: `#quadro-${p.id}`, icone: 'kanban' })}${btn('Editar', { href: `#tarefa-editar-${t.id}`, icone: 'pencil' })}<button type="button" class="btn btn-danger-outline" data-excluir="tarefa:${t.id}" data-nome="${esc(t.titulo)}">${ic('trash3', 'ico-sm')}<span>Excluir</span></button>` })}
  <div class="grid grid-side">
    <section class="card"><div class="card-head"><h2>Resumo</h2>${est(estagioDe(t))}</div><div class="card-body">${pares([['Projeto', `<a href="#quadro-${p.id}">${esc(p.nome)}</a>`], ['Equipe', esc(equipes.find((e) => e.id === p.equipe).nome)], ['Prioridade', prio(t.prioridade)], ['Responsável', t.responsavel ? `<span style="display:inline-flex;gap:8px;align-items:center">${avatar(U(t.responsavel), 'sm')}${esc(nomeCompleto(U(t.responsavel)))}</span>` : 'Sem responsável'], ['Prazo', `<span class="num">${fmt(t.prazo)}</span>`], ['Criada em', `<span class="num">${fmt(t.criada)}</span>`], ['Descrição', esc(t.desc) || '<span class="muted">Sem descrição.</span>', true]])}</div></section>
    <div class="grid" style="align-content:start">
      <section class="card"><div class="card-head"><div><h3>Minhas anotações</h3><p class="small">Só você vê.</p></div><button type="button" class="btn btn-secondary btn-sm" data-novo="anotacao:${t.id}">${ic('plus-lg', 'ico-sm')}<span>Nova</span></button></div><div class="card-body" style="padding-top:4px;padding-bottom:4px"><div class="list">
        ${ns.map((n) => `<div class="list-row"><div class="grow"><a class="small num" href="#anotacao-${n.id}">${fmt(n.criada)}</a><p>${esc(n.texto)}</p></div></div>`).join('') || '<p class="muted" style="padding:16px 0">Você ainda não fez anotações nesta tarefa.</p>'}</div></div></section>
      <section class="card"><div class="card-head"><div><h3>Meus apontamentos</h3><p class="small num">${horas ? `${String(horas).replace('.', ',')}h no total` : 'Só você vê.'}</p></div><button type="button" class="btn btn-secondary btn-sm" data-novo="apontamento:${t.id}">${ic('clock-history', 'ico-sm')}<span>Apontar</span></button></div><div class="card-body" style="padding-top:4px;padding-bottom:4px"><div class="list">
        ${as.map((a) => `<div class="list-row"><a class="num" href="#apontamento-${a.id}">${fmt(a.data)}</a><span class="grow ellipsis muted">${esc(a.desc)}</span><span class="badge b-brand plain num">${String(a.horas).replace('.', ',')}h</span></div>`).join('') || '<p class="muted" style="padding:16px 0">Você ainda não apontou horas nesta tarefa.</p>'}</div></div></section>
    </div>
  </div>`;
};

telas.anotacoes = () => {
  const lista = [...minhasNotas()].sort((a, b) => b.criada - a.criada);

  const genero = { tarefa: 'Tarefa', anotacao: 'Anotação', apontamento: 'Apontamento', projeto: 'Projeto', estagio: 'Estágio', equipe: 'Equipe' }[tipo];
  const fem = ['tarefa', 'anotacao', 'equipe'].includes(tipo);
  toast(`${genero} ${novo ? (fem ? 'cadastrada' : 'cadastrado') : (fem ? 'alterada' : 'alterado')}.`);
  ir(estado.retorno || (tipo === 'projeto' && novo ? `#quadro-${obj.id}` : NOMES[tipo][2]));
}
const RESPOSTAS = [
  [/mover|quadro|estágio/i, 'Abra **Quadros**, escolha o projeto e use as setas do cartão:\n\n1. **▶** leva a tarefa para o próximo estágio.\n2. **◀** volta ao estágio anterior.\n\nUma mensagem confirma a mudança.'],
  [/projeto/i, 'Gerentes e administradores criam projetos em **Meus projetos › Novo projeto**. O quadro já nasce com os estágios *Backlog*, *Em andamento*, *Concluído* e *Aprovado*.'],
  [/anota|privad/i, '**Sim, são privadas.** Só você vê, edita e exclui as suas anotações, nem administradores têm acesso.'],
  [/hora|apont/i, 'Abra a tarefa e use **Apontar**, ou vá em **Meus apontamentos › Apontar horas**. Informe a data e de `0,25` a `24` horas.'],
];
function perguntar(texto) {
  if (!texto.trim()) return;
  mensagens.push({ papel: 'user', texto }); render();
  const msgs = document.getElementById('msgs'); msgs.insertAdjacentHTML('beforeend', '<div class="msg bot" id="digitando"><span class="typing" aria-label="Assistente digitando"><i></i><i></i><i></i></span></div>'); msgs.scrollTop = msgs.scrollHeight;
  setTimeout(() => {
    const r = (RESPOSTAS.find(([re]) => re.test(texto)) || [null, 'Posso ajudar com o uso do Outsourcing: **quadros**, **tarefas**, **anotações**, **apontamentos**, **projetos** e **equipes**. Tente reformular a pergunta citando uma dessas telas.'])[1];
    mensagens.push({ papel: 'bot', texto: r }); chamadas.unshift({ id: chamadas.length + 1, usuario: eu().id, origem: 'assistente', status: 'sucesso', modelo: ia.modelo, ent: 1100, sai: 120, ms: 4200, quando: '11/11/2026 22:10', pergunta: texto, resposta: r });
    if (location.hash === '#assistente') render();
  }, 900);
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-acao],[data-excluir],[data-mover],[data-nova-tarefa],[data-novo],[data-papel],[data-pagina],[data-limpar],[data-toggle-filtros],[data-faq]');
  if (!a) { if (estado.menuAberto && !e.target.closest('.menu')) { estado.menuAberto = false; render(); } return; }
  const d = a.dataset;
  if (d.acao === 'menu') { if (matchMedia('(max-width: 991.98px)').matches) estado.gaveta = !estado.gaveta; else estado.recolhida = !estado.recolhida; return render(); }
  if (d.acao === 'fechar-gaveta') { estado.gaveta = false; return render(); }
  if (d.acao === 'tema') { const escuro = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme = escuro ? 'light' : 'dark'; return render(); }
  if (d.acao === 'menu-usuario') { estado.menuAberto = !estado.menuAberto; return render(); }
  if (d.acao === 'sair') { estado.logado = false; estado.menuAberto = false; toast('Você saiu do sistema.', 'info'); return ir('#entrar'); }
  if (d.acao === 'testar') { a.disabled = true; a.querySelector('span').textContent = 'Testando…'; setTimeout(() => { toast(`Conexão bem-sucedida. Modelo disponível: ${MODELOS[ia.modelo]}.`); chamadas.unshift({ id: chamadas.length + 1, usuario: eu().id, origem: 'teste_conexao', status: 'sucesso', modelo: ia.modelo, ent: 0, sai: 0, ms: 690, quando: '11/11/2026 22:05', pergunta: '(teste de conexão)', resposta: '' }); render(); }, 900); return; }
  if (d.acao === 'limpar-chat') { mensagens.length = 0; toast('Histórico apagado.'); return render(); }
  if (d.papel) { estado.papel = d.papel; estado.menuAberto = false; estado.filtros = {}; toast(`Visualizando como ${PAPEIS[d.papel]}.`, 'info'); const [r] = resolver(location.hash.slice(1)); return render(); }
  if (d.pagina) { const [id, p] = d.pagina.split(':'); estado.pagina[id] = Number(p); return render(); }
  if (d.limpar) { delete estado.filtros[d.limpar]; estado.pagina[d.limpar] = 1; return render(); }
  if (d.toggleFiltros) { document.querySelector(`[data-filtro="${d.toggleFiltros}"]`).classList.toggle('open'); return; }
  if (d.faq) return perguntar(d.faq);
  if (d.mover) { const [tid, sid] = d.mover.split(':').map(Number); const t = tarefas.find((x) => x.id === tid); t.estagio = sid; toast(`Tarefa movida para ${estagios.find((s) => s.id === sid).nome}.`); return render(); }
  if (d.novaTarefa) { estado.estagioInicial = Number(d.novaTarefa); estado.retorno = location.hash; return ir('#tarefa-nova'); }
  if (d.novo) { const [tipo, tid] = d.novo.split(':'); estado.tarefaInicial = Number(tid); estado.retorno = location.hash; return ir(tipo === 'anotacao' ? '#anotacao-nova' : '#apontamento-novo'); }
  if (d.excluir) { const [tipo, id] = d.excluir.split(':'); const [artigo] = ROTULOS[tipo]; return confirmar(`Excluir ${tipo === 'anotacao' ? 'anotação' : tipo === 'apontamento' ? 'apontamento' : tipo === 'estagio' ? 'estágio' : tipo}?`, `Excluir ${artigo ? artigo + ' ' : ''}<strong>${esc(d.nome)}</strong>? Esta ação não pode ser desfeita.`, () => excluirRegistro(tipo, Number(id))); }
});
document.addEventListener('submit', (e) => {
  const f = e.target; e.preventDefault();
  if (f.id === 'busca') { estado.filtros.tarefas = { ...(estado.filtros.tarefas || {}), titulo: f.querySelector('input').value }; estado.pagina.tarefas = 1; return ir('#tarefas'); }
  if (f.id === 'form-chat') { const t = f.querySelector('textarea'); const v = t.value; t.value = ''; return perguntar(v); }
  if (f.dataset.filtro) { estado.filtros[f.dataset.filtro] = Object.fromEntries(new FormData(f)); estado.pagina[f.dataset.filtro] = 1; return render(); }
  if (f.dataset.form && validar(f)) salvar(f);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (document.getElementById('modal-root').innerHTML) { document.getElementById('modal-root').innerHTML = ''; return; } if (estado.gaveta || estado.menuAberto) { estado.gaveta = false; estado.menuAberto = false; render(); } }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'pergunta') { e.preventDefault(); e.target.form.requestSubmit(); }
});
document.getElementById('pular').addEventListener('click', (e) => { e.preventDefault(); const c = document.getElementById('conteudo'); c && c.focus(); });
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
render();
</script>
