{% extends "base.html" %}
{% load crispy_forms_tags ui %}
{% block title %}{{ titulo }} · Outsourcing{% endblock %}
{% block content %}
<header>
  {% trilha atual=titulo %}
  <div class="page-head"><div><h1>{{ titulo }}</h1></div></div>
</header>
<form method="post" novalidate class="card form-card">
  {% csrf_token %}
  <div class="card-body">{{ form|crispy }}</div>
  <div class="card-foot form-foot justify-content-end">
    {% if voltar %}<a class="btn btn-outline-secondary" href="{{ voltar }}">Cancelar</a>{% endif %}
    <button class="btn btn-primary">{% icone "check-lg" %}<span>{{ botao|default:"Salvar" }}</span></button>
  </div>
</form>
{% endblock %}
