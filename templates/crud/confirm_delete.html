{% extends "base.html" %}
{% block title %}{{ titulo }} · Outsourcing{% endblock %}
{% block content %}
<h1>{{ titulo }}</h1>
<div class="card narrow">
  <div class="card-body">
    <p>Excluir <strong>{{ object }}</strong>? Esta ação não pode ser desfeita.</p>
    <form method="post" class="d-flex gap-2">
      {% csrf_token %}
      <button class="btn btn-danger">Excluir</button>
      <a class="btn btn-outline-secondary" href="{{ voltar }}">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
