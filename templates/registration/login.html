{% extends "auth_base.html" %}
{% load crispy_forms_tags ui %}
{% block title %}Entrar · Outsourcing{% endblock %}
{% block auth_conteudo %}
<div><h1>Entrar</h1><p class="text-secondary mb-0">Use o e-mail e a senha da sua conta.</p></div>
<form method="post" class="card form-card">
  {% csrf_token %}
  <div class="card-body">
    {{ form|crispy }}
    <input type="hidden" name="next" value="{{ next }}">
  </div>
  <div class="card-foot form-foot"><button class="btn btn-primary w-100">{% icone "box-arrow-in-right" %}<span>Entrar</span></button></div>
</form>
<p class="text-center text-secondary mb-0">Ainda não tem conta? <a href="{% url 'accounts:cadastro' %}">Criar conta</a></p>
{% endblock %}
