{% load crispy_forms_tags ui %}
<form method="get" class="filters" id="filtros">
  {% for campo in filter.form %}
    <div>{{ campo|as_crispy_field }}</div>
  {% endfor %}
  <div class="acoes">
    <button class="btn btn-primary btn-sm">{% icone "funnel" %}<span>Filtrar</span></button>
    <a class="btn btn-outline-secondary btn-sm" href="{{ request.path }}">Limpar</a>
  </div>
</form>
