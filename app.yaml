# Sem segredos. Gere o arquivo de deploy com: python scripts/gerar_app_local.py
runtime: python312
entrypoint: gunicorn -b :$PORT --workers 1 --threads 4 config.wsgi

handlers:
- url: /static
  static_dir: static_gcloud/
  secure: always
- url: /.*
  script: auto
  secure: always

automatic_scaling:
  min_instances: 0
  max_instances: 2
